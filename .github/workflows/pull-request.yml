# Deploy to: GitHub Actions runner
# Apply: automatic on pull_request to main
# Module: full-infra (cross-module)
# Requires: none

# Detects changed module paths in the PR diff and runs the corresponding
# validation jobs conditionally, per runtime. Full-stack Docker validation runs
# only when stack or module Docker paths change; the umbrella chart and the
# EKS/registry Terraform are validated only when their own paths change. Writes
# a per-module pass/fail summary into the PR.
# Parameters modified from baseline: dynamic promtool/blackbox images, monitoring
# consistency checks, and full-infra-terraform job added.
name: pull-request

on:
  pull_request:
    branches: main

jobs:
  detect-changes:
    runs-on: ubuntu-24.04-arm
    outputs:
      web-server-docker: ${{ steps.filter.outputs.web-server-docker }}
      web-server-helm: ${{ steps.filter.outputs.web-server-helm }}
      file-transfer: ${{ steps.filter.outputs.file-transfer }}
      dns-docker: ${{ steps.filter.outputs.dns-docker }}
      dns-helm: ${{ steps.filter.outputs.dns-helm }}
      reverse-proxy-docker: ${{ steps.filter.outputs.reverse-proxy-docker }}
      reverse-proxy-helm: ${{ steps.filter.outputs.reverse-proxy-helm }}
      monitoring: ${{ steps.filter.outputs.monitoring }}
      full-infra: ${{ steps.filter.outputs.full-infra }}
      full-infra-terraform: ${{ steps.filter.outputs.full-infra-terraform }}
      full-infra-helm: ${{ steps.filter.outputs.full-infra-helm }}
      full-infra-terraform-kubernetes: ${{ steps.filter.outputs.full-infra-terraform-kubernetes }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Detect changed paths
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            web-server-docker:
              - 'modules/web-server/docker/**'
              - 'modules/web-server/README.md'
              - '.github/workflows/web-server.yml'

            web-server-helm:
              - 'modules/web-server/kubernetes/**'
              - 'modules/web-server/README.md'
              - '.github/workflows/web-server.yml'

            file-transfer:
              - 'modules/file-transfer/docker/**'
              - 'modules/file-transfer/README.md'
              - '.github/workflows/file-transfer.yml'

            dns-docker:
              - 'modules/dns/docker/**'
              - 'modules/dns/README.md'
              - '.github/workflows/dns.yml'

            dns-helm:
              - 'modules/dns/kubernetes/**'
              - 'modules/dns/README.md'
              - '.github/workflows/dns.yml'

            reverse-proxy-docker:
              - 'modules/reverse-proxy/docker/**'
              - 'modules/reverse-proxy/README.md'
              - '.github/workflows/reverse-proxy.yml'

            reverse-proxy-helm:
              - 'modules/reverse-proxy/kubernetes/**'
              - 'modules/reverse-proxy/README.md'
              - '.github/workflows/reverse-proxy.yml'

            monitoring:
              - 'modules/monitoring/docker/**'
              - 'modules/monitoring/README.md'
              - '.github/workflows/monitoring.yml'
              - '.github/scripts/validate-monitoring.sh'

            full-infra:
              - 'stacks/full-infra/docker/**'
              - 'modules/**/docker/**'
              - '.github/workflows/full-infra.yml'
              - '.github/scripts/validate-monitoring.sh'

            full-infra-terraform:
              - 'stacks/full-infra/docker/automation/terraform/**'
              - '.github/workflows/full-infra.yml'

            full-infra-helm:
              - 'stacks/full-infra/kubernetes/helm/**'
              - 'modules/**/kubernetes/helm/**'
              - '.github/workflows/full-infra.yml'

            full-infra-terraform-kubernetes:
              - 'stacks/full-infra/kubernetes/automation/terraform/**'
              - '.github/workflows/full-infra.yml'

  validate-web-server-docker:
    needs: detect-changes
    if: needs.detect-changes.outputs.web-server-docker == 'true'
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build custom web-server image
        uses: docker/build-push-action@v7
        with:
          context: modules/web-server/docker/
          push: false
          tags: web-server:pr

  validate-web-server-helm:
    needs: detect-changes
    if: needs.detect-changes.outputs.web-server-helm == 'true'
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Helm lint
        run: helm lint modules/web-server/kubernetes/helm/web-server

      - name: Helm template (dev)
        run: |
          helm template modules/web-server/kubernetes/helm/web-server \
            -f modules/web-server/kubernetes/helm/web-server/values.yaml \
            -f modules/web-server/kubernetes/helm/web-server/values-dev.yaml

      - name: Helm template (prod)
        run: |
          helm template modules/web-server/kubernetes/helm/web-server \
            -f modules/web-server/kubernetes/helm/web-server/values.yaml \
            -f modules/web-server/kubernetes/helm/web-server/values-prod.yaml

  validate-file-transfer:
    needs: detect-changes
    if: needs.detect-changes.outputs.file-transfer == 'true'
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: modules/file-transfer/docker/

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate development Compose syntax
        run: docker compose -f docker-compose.yml config

      - name: Validate production Compose syntax
        run: docker compose -f docker-compose.prod.yml config

  validate-dns-docker:
    needs: detect-changes
    if: needs.detect-changes.outputs.dns-docker == 'true'
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: modules/dns/docker/

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate development Compose syntax
        run: docker compose -f docker-compose.yml config

      - name: Validate production Compose syntax
        run: docker compose -f docker-compose.prod.yml config

  validate-dns-helm:
    needs: detect-changes
    if: needs.detect-changes.outputs.dns-helm == 'true'
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: modules/dns/kubernetes/helm/dns/

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build custom dns image
        uses: docker/build-push-action@v7
        with:
          context: modules/dns/kubernetes/
          push: false
          tags: dns:pr

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Helm lint (dev)
        run: helm lint . -f values.yaml -f values-dev.yaml

      - name: Helm lint (prod)
        run: helm lint . -f values.yaml -f values-prod.yaml

      - name: Helm template (dev)
        run: helm template dns . -f values.yaml -f values-dev.yaml

      - name: Helm template (prod)
        run: helm template dns . -f values.yaml -f values-prod.yaml

  validate-reverse-proxy-docker:
    needs: detect-changes
    if: needs.detect-changes.outputs.reverse-proxy-docker == 'true'
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: modules/reverse-proxy/docker/

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate development Compose syntax
        run: docker compose -f docker-compose.yml config

      - name: Validate production Compose syntax
        run: docker compose -f docker-compose.prod.yml config

  validate-reverse-proxy-helm:
    needs: detect-changes
    if: needs.detect-changes.outputs.reverse-proxy-helm == 'true'
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: modules/reverse-proxy/kubernetes/helm/reverse-proxy/

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Add Traefik chart repository
        run: helm repo add traefik https://traefik.github.io/charts

      - name: Resolve chart dependencies from Chart.lock
        run: helm dependency build

      - name: Helm lint (dev)
        run: helm lint . -f values.yaml -f values-dev.yaml

      - name: Helm lint (prod)
        run: helm lint . -f values.yaml -f values-prod.yaml

      - name: Helm template (dev)
        run: helm template reverse-proxy . -f values.yaml -f values-dev.yaml

      - name: Helm template (prod)
        run: helm template reverse-proxy . -f values.yaml -f values-prod.yaml

  validate-monitoring:
    needs: detect-changes
    if: needs.detect-changes.outputs.monitoring == 'true'
    runs-on: ubuntu-24.04-arm
    env:
      GRAFANA_ADMIN_PASSWORD: ci-check
    defaults:
      run:
        working-directory: modules/monitoring/docker/

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate development Compose syntax
        run: docker compose -f docker-compose.yml config --quiet

      - name: Validate production Compose syntax
        run: docker compose -f docker-compose.prod.yml config --quiet

      - name: Validate Prometheus configuration
        run: |
          PROM_IMAGE="$(docker compose -f docker-compose.prod.yml config --format json | jq -r '.services.prometheus.image')"
          docker run --rm --entrypoint promtool \
            -v "$PWD/configs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
            "$PROM_IMAGE" \
            check config /etc/prometheus/prometheus.yml

      - name: Validate Blackbox Exporter configuration
        run: |
          BB_IMAGE="$(docker compose -f docker-compose.prod.yml config --format json | jq -r '.services["blackbox-exporter"].image')"
          docker run --rm \
            -v "$PWD/configs/blackbox/blackbox.yml:/config/blackbox.yml:ro" \
            "$BB_IMAGE" \
            --config.file=/config/blackbox.yml --config.check

      - name: Validate Grafana dashboard JSON
        run: python3 -m json.tool configs/grafana/dashboards/lab-overview.json > /dev/null

      - name: Validate monitoring consistency
        run: ../../../.github/scripts/validate-monitoring.sh module

  validate-full-infra:
    needs: detect-changes
    if: needs.detect-changes.outputs.full-infra == 'true'
    runs-on: ubuntu-24.04-arm
    env:
      GRAFANA_ADMIN_PASSWORD: ci-check
    defaults:
      run:
        working-directory: stacks/full-infra/docker/

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Validate full-stack Compose syntax
        run: docker compose -f docker-compose.prod.yml config

      - name: Validate monitoring against the stack
        run: ../../../.github/scripts/validate-monitoring.sh stack docker-compose.prod.yml

      - name: Build full stack
        run: docker compose -f docker-compose.prod.yml build

  validate-full-infra-terraform:
    needs: detect-changes
    if: needs.detect-changes.outputs.full-infra-terraform == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stacks/full-infra/docker/automation/terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Materialize ignored files from examples
        run: |
          # main.tf and outputs.tf are gitignored; without copying from examples, terraform validate checks only variables.tf
          cp main.tf.example main.tf
          cp outputs.tf.example outputs.tf

      - name: Check the bootstrap script
        run: |
          bash -n user_data.sh
          shellcheck --severity=warning user_data.sh

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform format check
        run: terraform fmt -check

      - name: Terraform init without backend
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate

  validate-full-infra-helm:
    needs: detect-changes
    if: needs.detect-changes.outputs.full-infra-helm == 'true'
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Add Traefik chart repository
        run: helm repo add traefik https://traefik.github.io/charts

      - name: Build reverse-proxy dependencies
        run: helm dependency build modules/reverse-proxy/kubernetes/helm/reverse-proxy

      - name: Build umbrella dependencies
        working-directory: stacks/full-infra/kubernetes/helm/full-infra
        run: helm dependency build

      - name: Lint umbrella chart (dev and prod)
        working-directory: stacks/full-infra/kubernetes/helm/full-infra
        run: |
          for ENV in dev prod; do
            helm lint . -f values.yaml -f values-$ENV.yaml \
              --set web-server.image.repository=registry.example.com/web-server \
              --set dns.image.repository=registry.example.com/dns
          done

      - name: Render umbrella chart and check cross-module names
        working-directory: stacks/full-infra/kubernetes/helm/full-infra
        run: |
          for ENV in dev prod; do
            helm template full-infra . -n full-infra-$ENV -f values.yaml -f values-$ENV.yaml \
              --set web-server.image.repository=registry.example.com/web-server \
              --set dns.image.repository=registry.example.com/dns > /tmp/full-infra-$ENV.yaml
            if grep -qE 'web-server-web-server|dns-dns' /tmp/full-infra-$ENV.yaml; then
              echo "::error::Stale module Service name in the $ENV render"
              exit 1
            fi
          done

  validate-full-infra-terraform-kubernetes:
    needs: detect-changes
    if: needs.detect-changes.outputs.full-infra-terraform-kubernetes == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack:
          - cluster
          - registry
    defaults:
      run:
        working-directory: stacks/full-infra/kubernetes/automation/terraform/${{ matrix.stack }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform format check
        run: terraform fmt -check

      - name: Terraform init without backend
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate

  summary:
    needs:
      - validate-web-server-docker
      - validate-web-server-helm
      - validate-file-transfer
      - validate-dns-docker
      - validate-dns-helm
      - validate-reverse-proxy-docker
      - validate-reverse-proxy-helm
      - validate-monitoring
      - validate-full-infra
      - validate-full-infra-terraform
      - validate-full-infra-helm
      - validate-full-infra-terraform-kubernetes
    if: always()
    runs-on: ubuntu-24.04-arm
    permissions:
      pull-requests: write

    steps:
      - name: Publish CI summary
        uses: actions/github-script@v9
        with:
          script: |
            const results = {
              "web-server (docker)": "${{ needs.validate-web-server-docker.result }}",
              "web-server (helm)": "${{ needs.validate-web-server-helm.result }}",
              "file-transfer": "${{ needs.validate-file-transfer.result }}",
              "dns (docker)": "${{ needs.validate-dns-docker.result }}",
              "dns (helm)": "${{ needs.validate-dns-helm.result }}",
              "reverse-proxy (docker)": "${{ needs.validate-reverse-proxy-docker.result }}",
              "reverse-proxy (helm)": "${{ needs.validate-reverse-proxy-helm.result }}",
              "monitoring": "${{ needs.validate-monitoring.result }}",
              "full-infra (docker)": "${{ needs.validate-full-infra.result }}",
              "full-infra (terraform docker)": "${{ needs.validate-full-infra-terraform.result }}",
              "full-infra (helm)": "${{ needs.validate-full-infra-helm.result }}",
              "full-infra (terraform kubernetes)": "${{ needs.validate-full-infra-terraform-kubernetes.result }}"
            };

            let body = "### CI Summary\n\n| Module | Result |\n|---|---|\n";

            for (const [module, result] of Object.entries(results)) {
              body += `| ${module} | ${result} |\n`;
            }

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });