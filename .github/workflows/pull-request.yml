# Deploy to: GitHub Actions runner
# Apply: automatic on pull_request to main
# Module: full-infra (cross-module)
# Requires: none

# Detects changed module paths in the PR diff and runs the corresponding
# validation jobs conditionally, per runtime. Full-stack Docker validation runs
# only when stack or module Docker paths change. Writes a per-module pass/fail
# summary into the PR.
# Parameters modified from baseline: web-server, reverse-proxy and dns split into
# independent docker/helm path filters and jobs; summary extended accordingly.

name: pull-request

on:
  pull_request:
    branches: main

jobs:
  detect-changes:
    runs-on: ubuntu-24.04-arm
    outputs:
      web-server-docker: ${{ steps.filter.outputs.web-server-docker }}
      web-server-helm: ${{ steps.filter.outputs.web-server-helm }}
      file-transfer: ${{ steps.filter.outputs.file-transfer }}
      dns-docker: ${{ steps.filter.outputs.dns-docker }}
      dns-helm: ${{ steps.filter.outputs.dns-helm }}
      reverse-proxy-docker: ${{ steps.filter.outputs.reverse-proxy-docker }}
      reverse-proxy-helm: ${{ steps.filter.outputs.reverse-proxy-helm }}
      full-infra: ${{ steps.filter.outputs.full-infra }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Detect changed paths
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            web-server-docker:
              - 'modules/web-server/docker/**'
              - 'modules/web-server/README.md'
              - '.github/workflows/web-server.yml'

            web-server-helm:
              - 'modules/web-server/kubernetes/**'
              - 'modules/web-server/README.md'
              - '.github/workflows/web-server.yml'

            file-transfer:
              - 'modules/file-transfer/docker/**'
              - 'modules/file-transfer/README.md'
              - '.github/workflows/file-transfer.yml'

            dns-docker:
              - 'modules/dns/docker/**'
              - 'modules/dns/README.md'
              - '.github/workflows/dns.yml'

            dns-helm:
              - 'modules/dns/kubernetes/**'
              - 'modules/dns/README.md'
              - '.github/workflows/dns.yml'

            reverse-proxy-docker:
              - 'modules/reverse-proxy/docker/**'
              - 'modules/reverse-proxy/README.md'
              - '.github/workflows/reverse-proxy.yml'

            reverse-proxy-helm:
              - 'modules/reverse-proxy/kubernetes/**'
              - 'modules/reverse-proxy/README.md'
              - '.github/workflows/reverse-proxy.yml'

            full-infra:
              - 'stacks/full-infra/docker/**'
              - 'modules/**/docker/**'
              - '.github/workflows/full-infra.yml'

  validate-web-server-docker:
    needs: detect-changes
    if: needs.detect-changes.outputs.web-server-docker == 'true'
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build custom web-server image
        uses: docker/build-push-action@v7
        with:
          context: modules/web-server/docker/
          push: false
          tags: web-server:pr

  validate-web-server-helm:
    needs: detect-changes
    if: needs.detect-changes.outputs.web-server-helm == 'true'
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Helm lint
        run: helm lint modules/web-server/kubernetes/helm/web-server

      - name: Helm template (dev)
        run: |
          helm template modules/web-server/kubernetes/helm/web-server \
            -f modules/web-server/kubernetes/helm/web-server/values.yaml \
            -f modules/web-server/kubernetes/helm/web-server/values-dev.yaml

      - name: Helm template (prod)
        run: |
          helm template modules/web-server/kubernetes/helm/web-server \
            -f modules/web-server/kubernetes/helm/web-server/values.yaml \
            -f modules/web-server/kubernetes/helm/web-server/values-prod.yaml

  validate-file-transfer:
    needs: detect-changes
    if: needs.detect-changes.outputs.file-transfer == 'true'
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: modules/file-transfer/docker/

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate development Compose syntax
        run: docker compose -f docker-compose.yml config

      - name: Validate production Compose syntax
        run: docker compose -f docker-compose.prod.yml config

  validate-dns-docker:
    needs: detect-changes
    if: needs.detect-changes.outputs.dns-docker == 'true'
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: modules/dns/docker/

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate development Compose syntax
        run: docker compose -f docker-compose.yml config

      - name: Validate production Compose syntax
        run: docker compose -f docker-compose.prod.yml config

  validate-dns-helm:
    needs: detect-changes
    if: needs.detect-changes.outputs.dns-helm == 'true'
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: modules/dns/kubernetes/helm/dns/

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build custom dns image
        uses: docker/build-push-action@v7
        with:
          context: modules/dns/kubernetes/
          push: false
          tags: dns:pr

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Helm lint (dev)
        run: helm lint . -f values.yaml -f values-dev.yaml

      - name: Helm lint (prod)
        run: helm lint . -f values.yaml -f values-prod.yaml

      - name: Helm template (dev)
        run: helm template dns . -f values.yaml -f values-dev.yaml

      - name: Helm template (prod)
        run: helm template dns . -f values.yaml -f values-prod.yaml

  validate-reverse-proxy-docker:
    needs: detect-changes
    if: needs.detect-changes.outputs.reverse-proxy-docker == 'true'
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: modules/reverse-proxy/docker/

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate development Compose syntax
        run: docker compose -f docker-compose.yml config

      - name: Validate production Compose syntax
        run: docker compose -f docker-compose.prod.yml config

  validate-reverse-proxy-helm:
    needs: detect-changes
    if: needs.detect-changes.outputs.reverse-proxy-helm == 'true'
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: modules/reverse-proxy/kubernetes/helm/reverse-proxy/

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Add Traefik chart repository
        run: helm repo add traefik https://traefik.github.io/charts

      - name: Resolve chart dependencies from Chart.lock
        run: helm dependency build

      - name: Helm lint (dev)
        run: helm lint . -f values.yaml -f values-dev.yaml

      - name: Helm lint (prod)
        run: helm lint . -f values.yaml -f values-prod.yaml

      - name: Helm template (dev)
        run: helm template reverse-proxy . -f values.yaml -f values-dev.yaml

      - name: Helm template (prod)
        run: helm template reverse-proxy . -f values.yaml -f values-prod.yaml

  validate-full-infra:
    needs: detect-changes
    if: needs.detect-changes.outputs.full-infra == 'true'
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: stacks/full-infra/docker/

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Validate full-stack Compose syntax
        run: docker compose -f docker-compose.prod.yml config

      - name: Build full stack
        run: docker compose -f docker-compose.prod.yml build

  summary:
    needs:
      - validate-web-server-docker
      - validate-web-server-helm
      - validate-file-transfer
      - validate-dns-docker
      - validate-dns-helm
      - validate-reverse-proxy-docker
      - validate-reverse-proxy-helm
      - validate-full-infra
    if: always()
    runs-on: ubuntu-24.04-arm
    permissions:
      pull-requests: write

    steps: