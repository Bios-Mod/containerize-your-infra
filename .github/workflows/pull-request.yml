# Deploy to:   GitHub Actions runner
# Apply:       automatic on pull_request to main
# Module:      full-infra (cross-module)
# Requires:    none
#
# Detects changed module paths in the PR diff and runs the corresponding
# validation jobs conditionally. Full-infra validation always runs. Writes
# a per-module pass/fail summary into the PR.
# Parameters modified from baseline: none

name: pull-request

on:
  pull_request:
    branches: main

jobs:
  detect-changes:
    runs-on: ubuntu-24.04-arm
    outputs:
      web-server: ${{ steps.filter.outputs.web-server }}
      file-transfer: ${{ steps.filter.outputs.file-transfer }}
      dns: ${{ steps.filter.outputs.dns }}
      reverse-proxy: ${{ steps.filter.outputs.reverse-proxy }}
      full-infra: ${{ steps.filter.outputs.full-infra }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Detect changed paths
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            web-server:
              - 'modules/web-server/docker/**'
              - 'modules/web-server/README.md'
              - '.github/workflows/web-server.yml'

            file-transfer:
              - 'modules/file-transfer/docker/**'
              - 'modules/file-transfer/README.md'
              - '.github/workflows/file-transfer.yml'

            dns:
              - 'modules/dns/docker/**'
              - 'modules/dns/README.md'
              - '.github/workflows/dns.yml'

            reverse-proxy:
              - 'modules/reverse-proxy/docker/**'
              - 'modules/reverse-proxy/README.md'
              - '.github/workflows/reverse-proxy.yml'

            full-infra:
              - 'stacks/full-infra/docker/**'
              - 'modules/**/docker/**'
              - '.github/workflows/full-infra.yml'

  validate-web-server:
    needs: detect-changes
    if: needs.detect-changes.outputs.web-server == 'true'
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build custom web-server image
        uses: docker/build-push-action@v7
        with:
          context: modules/web-server/docker/
          push: false
          tags: web-server:pr

  validate-file-transfer:
    needs: detect-changes
    if: needs.detect-changes.outputs.file-transfer == 'true'
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: modules/file-transfer/docker/

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate development Compose syntax
        run: docker compose -f docker-compose.yml config

      - name: Validate production Compose syntax
        run: docker compose -f docker-compose.prod.yml config

  validate-dns:
    needs: detect-changes
    if: needs.detect-changes.outputs.dns == 'true'
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: modules/dns/docker/

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate development Compose syntax
        run: docker compose -f docker-compose.yml config

      - name: Validate production Compose syntax
        run: docker compose -f docker-compose.prod.yml config

  validate-reverse-proxy:
    needs: detect-changes
    if: needs.detect-changes.outputs.reverse-proxy == 'true'
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: modules/reverse-proxy/docker/

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate development Compose syntax
        run: docker compose -f docker-compose.yml config

      - name: Validate production Compose syntax
        run: docker compose -f docker-compose.prod.yml config

  validate-full-infra:
    needs: detect-changes
    if: needs.detect-changes.outputs.full-infra == 'true'
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: stacks/full-infra/docker/

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Validate full-stack Compose syntax
        run: docker compose -f docker-compose.prod.yml config

      - name: Build full stack
        run: docker compose -f docker-compose.prod.yml build

  summary:
    needs:
      - validate-web-server
      - validate-file-transfer
      - validate-dns
      - validate-reverse-proxy
      - validate-full-infra
    if: always()
    runs-on: ubuntu-24.04-arm
    permissions:
      pull-requests: write

    steps:
      - name: Publish CI summary
        uses: actions/github-script@v9
        with:
          script: |
            const results = {
              "web-server": "${{ needs.validate-web-server.result }}",
              "file-transfer": "${{ needs.validate-file-transfer.result }}",
              "dns": "${{ needs.validate-dns.result }}",
              "reverse-proxy": "${{ needs.validate-reverse-proxy.result }}",
              "full-infra": "${{ needs.validate-full-infra.result }}"
            };

            let body = "### CI Summary\n\n| Module | Result |\n|---|---|\n";

            for (const [module, result] of Object.entries(results)) {
              body += `| ${module} | ${result} |\n`;
            }

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });