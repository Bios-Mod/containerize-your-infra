# Deploy to: GitHub Actions runner
# Apply: automatic on push (paths filter)
# Module: reverse-proxy
# Requires: none

# Validates the reverse-proxy module in both runtimes. Docker: Compose syntax
# and image resolution (no custom build, Traefik uses the official image).
# Kubernetes: Helm dependency resolution, lint and template rendering for dev
# and prod. No cluster access — static validation only.
# Parameters modified from baseline: paths (kubernetes/** added), helm-validate job added

name: reverse-proxy

on:
  push:
    branches: main
    # paths for automatic validation of the reverse-proxy module. Changes to any of these
    paths:
      - "modules/reverse-proxy/docker/**"
      - "modules/reverse-proxy/kubernetes/**"
      - "modules/reverse-proxy/README.md"
      - ".github/workflows/reverse-proxy.yml"

jobs:
  docker-validate:
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: modules/reverse-proxy/docker/

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate docker-compose syntax
        run: docker compose -f docker-compose.yml config

      - name: Validate docker-compose.prod syntax
        run: docker compose -f docker-compose.prod.yml config

      - name: Pull image to confirm reference is valid (dev)
        run: docker compose -f docker-compose.yml pull

      - name: Pull image to confirm reference is valid (prod)
        run: docker compose -f docker-compose.prod.yml pull

  helm-validate:
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: modules/reverse-proxy/kubernetes/helm/reverse-proxy/

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Add Traefik chart repository
        run: helm repo add traefik https://traefik.github.io/charts

      - name: Resolve chart dependencies from Chart.lock
        run: helm dependency build

      - name: Lint chart (dev values)
        run: helm lint . -f values.yaml -f values-dev.yaml

      - name: Lint chart (prod values)
        run: helm lint . -f values.yaml -f values-prod.yaml

      - name: Render templates (dev)
        run: helm template reverse-proxy . -f values.yaml -f values-dev.yaml

      - name: Render templates (prod)
        run: helm template reverse-proxy . -f values.yaml -f values-prod.yaml