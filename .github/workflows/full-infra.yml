# Deploy to:   GitHub Actions runner
# Apply:       automatic on push (paths filter)
# Module:      full-infra
# Requires:    none
#
# Four independent jobs: Compose stack validation (config + build in stack
# context), Docker/EC2 Terraform static checks, umbrella chart validation (lint,
# render for dev and prod, stale name and monitoring Deployment checks) and
# EKS/registry Terraform static checks. No cluster access and no AWS credentials.
# Parameters modified from baseline: Kubernetes paths, helm, terraform-kubernetes, inline
# monitoring consistency, ignored-file materialization (Docker + Kubernetes), and user_data.sh checks added

name: full-infra

on:
  push:
    branches: main
    paths:
      - "stacks/full-infra/docker/**"
      - "stacks/full-infra/kubernetes/**"
      - "modules/**/docker/**"
      - "modules/**/kubernetes/**"
      - ".github/workflows/full-infra.yml"

jobs:
  compose:
    runs-on: ubuntu-24.04-arm
    env:
      GRAFANA_ADMIN_PASSWORD: ci-check
    defaults:
      run:
        working-directory: stacks/full-infra/docker/

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Validate full-stack Compose syntax
        run: docker compose -f docker-compose.prod.yml config

      - name: Verify Prometheus target hosts match stack services
        run: |
          prom_file="$GITHUB_WORKSPACE/modules/monitoring/docker/configs/prometheus/prometheus.yml"
          if [ ! -f "$prom_file" ]; then
            echo "::error::Missing Prometheus config: $prom_file" >&2
            exit 1
          fi
          prom_json="$(yq -o=json '.' < "$prom_file")"
          compose_json="$(docker compose -f docker-compose.prod.yml config --format json)"
          allowed_hosts="$(jq -r '.services // {} | to_entries[] | .key, (.value.container_name // empty)' <<< "$compose_json" | sort -u)"
          extract_host() {
            local host="${1#http://}"
            host="${host#https://}"
            host="${host%%/*}"
            host="${host%%:*}"
            printf '%s\n' "$host"
          }
          target_entries="$(jq -r '.scrape_configs[]? | .job_name as $job | .static_configs[]?.targets[]? | "\($job)\t\(.)"' <<< "$prom_json")"
          while IFS=$'\t' read -r job val; do
            [ -z "$val" ] && continue
            host="$(extract_host "$val")"
            [ "$host" = "localhost" ] && continue
            if ! grep -Fqx "$host" <<< "$allowed_hosts"; then
              echo "::error::Prometheus job '$job' target '$val' resolves to host '$host', which matches no service or container_name in docker-compose.prod.yml" >&2
              exit 1
            fi
          done <<< "$target_entries"
          repl_entries="$(jq -r '.scrape_configs[]? | .job_name as $job | .relabel_configs[]? | select(.replacement? != null and .replacement != "") | "\($job)\t\(.replacement)"' <<< "$prom_json")"
          while IFS=$'\t' read -r job val; do
            [ -z "$val" ] && continue
            host="$(extract_host "$val")"
            [ "$host" = "localhost" ] && continue
            if ! grep -Fqx "$host" <<< "$allowed_hosts"; then
              echo "::error::Prometheus job '$job' relabel replacement '$val' resolves to host '$host', which matches no service or container_name in docker-compose.prod.yml" >&2
              exit 1
            fi
          done <<< "$repl_entries"

      - name: Verify stack bind mount sources exist
        run: |
          root_real="$(cd "$GITHUB_WORKSPACE" && pwd -P)"
          bind_sources="$(docker compose -f docker-compose.prod.yml config --format json | jq -r '.services[]?.volumes[]? | select(.type == "bind") | .source // empty')"
          while IFS= read -r src; do
            [ -z "$src" ] && continue
            case "$src" in
              "$root_real/modules/"*|"$GITHUB_WORKSPACE/modules/"*|modules/*)
                case "$src" in
                  */configs/ssh/*|*/configs/keys/*|*/traefik/certs*)
                    continue
                    ;;
                esac
                if [ ! -e "$src" ]; then
                  echo "::error::Bind mount source does not exist: $src (in stacks/full-infra/docker/docker-compose.prod.yml)" >&2
                  exit 1
                fi
                ;;
            esac
          done <<< "$bind_sources"

      - name: Build full stack
        run: docker compose -f docker-compose.prod.yml build

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stacks/full-infra/docker/automation/terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Materialize ignored files from examples
        run: |
          # main.tf and outputs.tf are gitignored; without copying from examples, terraform validate checks only variables.tf
          cp main.tf.example main.tf
          cp outputs.tf.example outputs.tf

      - name: Check the bootstrap script
        run: |
          bash -n user_data.sh
          shellcheck --severity=warning user_data.sh

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform format check
        run: terraform fmt -check

      - name: Terraform init without backend
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate

  helm:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Add Traefik chart repository
        run: helm repo add traefik https://traefik.github.io/charts

      - name: Build reverse-proxy dependencies
        run: helm dependency build modules/reverse-proxy/kubernetes/helm/reverse-proxy

      - name: Build umbrella dependencies
        working-directory: stacks/full-infra/kubernetes/helm/full-infra
        run: helm dependency build

      - name: Lint umbrella chart (dev and prod)
        working-directory: stacks/full-infra/kubernetes/helm/full-infra
        run: |
          for ENV in dev prod; do
            helm lint . -f values.yaml -f values-$ENV.yaml \
              --set web-server.image.repository=registry.example.com/web-server \
              --set dns.image.repository=registry.example.com/dns
          done

      - name: Render umbrella chart and check cross-module names
        working-directory: stacks/full-infra/kubernetes/helm/full-infra
        run: |
          for ENV in dev prod; do
            helm template full-infra . -n full-infra-$ENV -f values.yaml -f values-$ENV.yaml \
              --set web-server.image.repository=registry.example.com/web-server \
              --set dns.image.repository=registry.example.com/dns > /tmp/full-infra-$ENV.yaml
            if grep -qE 'web-server-web-server|dns-dns|reverse-proxy-traefik' /tmp/full-infra-$ENV.yaml; then
              echo "::error::Stale module Service name in the $ENV render" >&2
              exit 1
            fi
            deploys="$(yq -o=json '.' < /tmp/full-infra-$ENV.yaml | jq -sr '[.[] | select(type == "object" and .kind == "Deployment") | .metadata.name] | .[]')"
            for name in full-infra-prometheus full-infra-blackbox full-infra-grafana; do
              if ! grep -Fqx "$name" <<< "$deploys"; then
                echo "::error::Missing Deployment '$name' in the $ENV umbrella render" >&2
                exit 1
              fi
            done
          done

  terraform-kubernetes:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack:
          - cluster
          - registry
    defaults:
      run:
        working-directory: stacks/full-infra/kubernetes/automation/terraform/${{ matrix.stack }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Materialize ignored files from examples
        run: |
          # main.tf and/or outputs.tf are gitignored; without copying existing .tf.example files, terraform validate skips them
          for f in main.tf outputs.tf; do
            if [ -f "$f.example" ] && [ ! -e "$f" ]; then
              cp -n "$f.example" "$f"
            fi
          done

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform format check
        run: terraform fmt -check

      - name: Terraform init without backend
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate
