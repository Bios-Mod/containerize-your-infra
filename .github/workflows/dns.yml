# Deploy to: GitHub Actions runner
# Apply: automatic on push (paths filter)
# Module: dns
# Requires: none

# Validates the dns module in both runtimes. Docker: Compose syntax and image
# resolution (no custom build, BIND9 uses the official image). Kubernetes: custom
# image build (the official image is amd64-only), Helm lint and template rendering
# for dev and prod. No cluster access — static validation only.
# Parameters modified from baseline: paths (kubernetes/** added), helm-validate job added

name: dns

on:
  push:
    branches: main
    # Paths for automatic validation of the dns module. Changes to any of these
    paths:
      - "modules/dns/docker/**"
      - "modules/dns/kubernetes/**"
      - "modules/dns/README.md"
      - ".github/workflows/dns.yml"

jobs:
  docker-validate:
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: modules/dns/docker/

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate development Compose syntax
        run: docker compose -f docker-compose.yml config

      - name: Validate production Compose syntax
        run: docker compose -f docker-compose.prod.yml config

      - name: Pull development image
        run: docker compose -f docker-compose.yml pull

      - name: Pull production image
        run: docker compose -f docker-compose.prod.yml pull

  helm-validate:
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: modules/dns/kubernetes/helm/dns/

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build custom dns image
        uses: docker/build-push-action@v7
        with:
          context: modules/dns/kubernetes/
          push: false
          tags: dns:ci

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Lint chart (dev values)
        run: helm lint . -f values.yaml -f values-dev.yaml

      - name: Lint chart (prod values)
        run: helm lint . -f values.yaml -f values-prod.yaml

      - name: Render templates (dev)
        run: helm template dns . -f values.yaml -f values-dev.yaml

      - name: Render templates (prod)
        run: helm template dns . -f values.yaml -f values-prod.yaml

      - name: Check the zone serial renders as an integer
        run: |
          helm template dns . -f values.yaml -f values-dev.yaml --show-only templates/configmap.yaml \
            | grep -E '^[[:space:]]+[0-9]{10} ; Serial'