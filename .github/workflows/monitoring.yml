# Deploy to:   GitHub Actions runner
# Apply:       automatic on push (paths filter)
# Module:      monitoring
# Requires:    none
#
# Validates the monitoring module Docker runtime: Compose syntax (dev and prod)
# with a dummy GRAFANA_ADMIN_PASSWORD, image resolution, Prometheus config
# (promtool), Blackbox Exporter config (--config.check), and Grafana dashboard
# JSON syntax. No container startup, no external proxy-net required.
# Parameters modified from baseline: reads promtool/blackbox images from compose; adds inline consistency checks

name: monitoring

on:
  push:
    branches: main
    paths:
      - "modules/monitoring/docker/**"
      - "modules/monitoring/README.md"
      - ".github/workflows/monitoring.yml"

jobs:
  validate:
    runs-on: ubuntu-24.04-arm
    env:
      GRAFANA_ADMIN_PASSWORD: ci-check
    defaults:
      run:
        working-directory: modules/monitoring/docker/

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate development Compose syntax
        run: docker compose -f docker-compose.yml config --quiet

      - name: Validate production Compose syntax
        run: docker compose -f docker-compose.prod.yml config --quiet

      - name: Pull development images
        run: docker compose -f docker-compose.yml pull

      - name: Pull production images
        run: docker compose -f docker-compose.prod.yml pull

      - name: Validate Prometheus configuration
        run: |
          PROM_IMAGE="$(docker compose -f docker-compose.prod.yml config --format json | jq -r '.services.prometheus.image')"
          docker run --rm --entrypoint promtool \
            -v "$PWD/configs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
            "$PROM_IMAGE" \
            check config /etc/prometheus/prometheus.yml

      - name: Validate Blackbox Exporter configuration
        run: |
          BB_IMAGE="$(docker compose -f docker-compose.prod.yml config --format json | jq -r '.services["blackbox-exporter"].image')"
          docker run --rm \
            -v "$PWD/configs/blackbox/blackbox.yml:/config/blackbox.yml:ro" \
            "$BB_IMAGE" \
            --config.file=/config/blackbox.yml --config.check

      - name: Validate Grafana dashboard JSON
        run: python3 -m json.tool configs/grafana/dashboards/lab-overview.json > /dev/null

      - name: Validate monitoring YAML syntax
        run: |
          shopt -s nullglob
          ds_files=(configs/grafana/provisioning/datasources/*.yml configs/grafana/provisioning/datasources/*.yaml)
          dash_files=(configs/grafana/provisioning/dashboards/*.yml configs/grafana/provisioning/dashboards/*.yaml)
          shopt -u nullglob
          if [ "${#ds_files[@]}" -eq 0 ]; then
            echo "::error::No Grafana datasource provisioning YAML files found under configs/grafana/provisioning/datasources" >&2
            exit 1
          fi
          if [ "${#dash_files[@]}" -eq 0 ]; then
            echo "::error::No Grafana dashboard provisioning YAML files found under configs/grafana/provisioning/dashboards" >&2
            exit 1
          fi
          for f in configs/prometheus/prometheus.yml configs/blackbox/blackbox.yml "${ds_files[@]}" "${dash_files[@]}"; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing expected YAML file: $f" >&2
              exit 1
            fi
            if ! yq '.' "$f" > /dev/null < /dev/null; then
              echo "::error::Invalid YAML syntax in $f" >&2
              exit 1
            fi
          done

      - name: Verify Prometheus probe modules exist in Blackbox config
        run: |
          prom_json="$(yq -o=json '.' configs/prometheus/prometheus.yml < /dev/null)"
          bb_json="$(yq -o=json '.' configs/blackbox/blackbox.yml < /dev/null)"
          bb_modules="$(jq -r '.modules // {} | keys[]' <<< "$bb_json")"
          prom_mods="$(jq -r '
            .scrape_configs[]?
            | .job_name as $job
            | (.params.module // [])
            | (if type == "array" then .[] else . end)
            | "\($job)\t\(.)"
          ' <<< "$prom_json")"
          while IFS=$'\t' read -r job mod; do
            [ -z "$mod" ] && continue
            if ! grep -Fqx "$mod" <<< "$bb_modules"; then
              echo "::error::Prometheus job '$job' references blackbox module '$mod', which is missing from .modules in modules/monitoring/docker/configs/blackbox/blackbox.yml" >&2
              exit 1
            fi
          done <<< "$prom_mods"

      - name: Validate Grafana dashboard metadata and datasource
        run: |
          dash="configs/grafana/dashboards/lab-overview.json"
          if [ ! -f "$dash" ]; then
            echo "::error::Missing Grafana dashboard file: $dash" >&2
            exit 1
          fi
          if ! jq -e '.' "$dash" > /dev/null; then
            echo "::error::Invalid JSON syntax in $dash" >&2
            exit 1
          fi
          dash_uid="$(jq -r '.uid // ""' "$dash")"
          dash_title="$(jq -r '.title // ""' "$dash")"
          if [ -z "${dash_uid//[[:space:]]/}" ]; then
            echo "::error::Dashboard $dash has an empty or missing uid" >&2
            exit 1
          fi
          if [ -z "${dash_title//[[:space:]]/}" ]; then
            echo "::error::Dashboard $dash has an empty or missing title" >&2
            exit 1
          fi
          shopt -s nullglob
          ds_files=(configs/grafana/provisioning/datasources/*.yml configs/grafana/provisioning/datasources/*.yaml)
          shopt -u nullglob
          provisioned_uids=""
          for f in "${ds_files[@]}"; do
            ds_json="$(yq -o=json '.' "$f" < /dev/null)"
            provisioned_uids+="$(jq -r '.datasources[]?.uid // empty' <<< "$ds_json")"$'\n'
          done
          referenced_uids="$(jq -r '
            [.. | objects | select(has("datasource")) | .datasource | select(type == "object") | .uid? // empty]
            | unique
            | .[]
          ' "$dash")"
          if [ -z "$referenced_uids" ]; then
            echo "::notice::Dashboard $dash references no datasource UIDs; skipping datasource UID cross-check"
          else
            while IFS= read -r ref_uid; do
              [ -z "$ref_uid" ] && continue
              if ! grep -Fqx "$ref_uid" <<< "$provisioned_uids"; then
                echo "::error::Dashboard $dash references datasource uid '$ref_uid', which is not provisioned under configs/grafana/provisioning/datasources" >&2
                exit 1
              fi
            done <<< "$referenced_uids"
          fi

      - name: Verify module bind mount sources exist
        run: |
          pwd_real="$(pwd -P)"
          bind_sources="$(docker compose -f docker-compose.prod.yml config --format json | jq -r '.services[]?.volumes[]? | select(.type == "bind") | .source // empty')"
          while IFS= read -r src; do
            [ -z "$src" ] && continue
            case "$src" in
              "$pwd_real/configs/"*|"$PWD/configs/"*|configs/*|./configs/*)
                if [ ! -e "$src" ]; then
                  echo "::error::Bind mount source does not exist: $src (in modules/monitoring/docker/docker-compose.prod.yml)" >&2
                  exit 1
                fi
                ;;
            esac
          done <<< "$bind_sources"
