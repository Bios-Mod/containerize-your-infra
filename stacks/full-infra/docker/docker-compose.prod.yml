# Deploy to:   Ubuntu 24.04 LTS — EC2 t4g.micro or local VM
# Apply:       docker compose -f docker-compose.prod.yml up -d --build
# Module:      full-infra
# Requires:    modules/web-server/docker/configs/, modules/file-transfer/docker/configs/,
#              modules/dns/docker/configs/, modules/reverse-proxy/docker/configs/traefik/certs/
#
# Full-stack production compose. Aggregates all modules into a single deployable unit.
# Config files are referenced from each module's configs/ directory — no duplication.
# Parameters modified from baseline: shared proxy-net, Traefik as sole HTTP/S ingress

services:

  # ── Reverse Proxy ─────────────────────────────────────────────────────────
  traefik:

    image: traefik:v3.7
    container_name: traefik

    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    environment:
      - TRAEFIK_PROVIDERS_DOCKER_NETWORK=proxy-net

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ../../../modules/reverse-proxy/docker/configs/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ../../../modules/reverse-proxy/docker/configs/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - ../../../modules/reverse-proxy/docker/configs/traefik/certs:/etc/traefik/certs:ro

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`traefik.localhost`)"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.routers.dashboard.tls=true"
      - "traefik.http.routers.dashboard.middlewares=auth-dashboard@file"

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    networks:
      - proxy-net

  # ── Web Server ────────────────────────────────────────────────────────────
  web-server:

    build:
      context: ../../../modules/web-server/docker/
      dockerfile: Dockerfile
    image: web-server:local

    container_name: web-server

    restart: unless-stopped

    tmpfs:
      - /var/cache/nginx:uid=101,gid=101
      - /var/run:uid=101,gid=101
      - /tmp:uid=101,gid=101

    read_only: true

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web-server.rule=Host(`web.localhost`)"
      - "traefik.http.routers.web-server.entrypoints=websecure"
      - "traefik.http.routers.web-server.tls=true"
      - "traefik.http.services.web-server.loadbalancer.server.port=8080"

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    networks:
      - proxy-net

  # ── File Transfer ─────────────────────────────────────────────────────────
  file-transfer:
    image: atmoz/sftp:alpine
    platform: linux/amd64
    container_name: file-transfer

    restart: unless-stopped

    ports:
      - "2222:22"

    environment:
      SFTP_USERS: "labuser::1001::upload"

    volumes:
      - ../../../modules/file-transfer/docker/configs/ssh/ssh_host_ed25519_key:/etc/ssh/ssh_host_ed25519_key
      - ../../../modules/file-transfer/docker/configs/ssh/ssh_host_rsa_key:/etc/ssh/ssh_host_rsa_key
      - ../../../modules/file-transfer/docker/configs/keys/labuser_ed25519.pub:/home/labuser/.ssh/keys/labuser_ed25519.pub:ro
      - file-transfer-data:/home/labuser/upload

    cap_drop:
      - ALL

    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
      - SYS_CHROOT

    healthcheck:
      test: ["CMD-SHELL", "pidof sshd || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    networks:
      - proxy-net

  # ── DNS ───────────────────────────────────────────────────────────────────
  dns:

    image: internetsystemsconsortium/bind9:9.20
    platform: linux/amd64
    container_name: dns
    
    restart: unless-stopped

    environment:
      - BIND9_USER=root
      - TZ=Etc/UTC

    ports:
      - "53:53/tcp"
      - "53:53/udp"

    volumes:
      - ../../../modules/dns/docker/configs/bind/named.conf:/etc/bind/named.conf:ro
      - ../../../modules/dns/docker/configs/bind/named.conf.options:/etc/bind/named.conf.options:ro
      - ../../../modules/dns/docker/configs/bind/named.conf.local:/etc/bind/named.conf.local:ro
      - ../../../modules/dns/docker/configs/bind/db.lab.local:/etc/bind/db.lab.local:ro
      - ../../../modules/dns/docker/configs/bind/db.172.20.0:/etc/bind/db.172.20.0:ro
      - dns-cache:/var/cache/bind

    command: ["-g"]

    healthcheck:
      test: ["CMD-SHELL", "pidof named || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

    networks:
      proxy-net:
        ipv4_address: 172.21.0.10

# ── Networks ──────────────────────────────────────────────────────────────
networks:
  proxy-net:
    driver: bridge
    name: proxy-net
    ipam:
      config:
        - subnet: 172.21.0.0/24

# ── Volumes ───────────────────────────────────────────────────────────────
volumes:
  file-transfer-data:
    name: file-transfer-data

  dns-cache:
    name: dns-cache