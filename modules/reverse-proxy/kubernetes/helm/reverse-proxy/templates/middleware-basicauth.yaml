# Deploy to:   EKS (full-infra-dev / full-infra-prod)
# Apply:       helm install / helm upgrade
# Module:      reverse-proxy
# Requires:    reverse-proxy-dashboard-auth Secret created via kubectl (Step 4) —
#              the bcrypt hash is never templated as plain YAML
#
# Middleware CRD implementing BasicAuth for the dashboard router.
# Parameters modified from baseline: none

apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ .Release.Name }}-auth-dashboard
spec:
  basicAuth:
    secret: {{ .Values.reverseProxy.dashboardAuthSecretName }}
