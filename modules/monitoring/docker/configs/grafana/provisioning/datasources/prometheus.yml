# Deploy to:   modules/monitoring/docker/configs/grafana/provisioning/datasources/prometheus.yml
# Apply:       docker compose up -d (bind mount → /etc/grafana/provisioning/datasources/prometheus.yml:ro)
# Module:      monitoring
# Requires:    prometheus service running on proxy-net
#
# Grafana datasource provisioning — registers Prometheus on proxy-net as default datasource.
# Parameters modified from baseline: uid prometheus, url http://prometheus:9090, default datasource

apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
