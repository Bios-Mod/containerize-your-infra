# Deploy to:   modules/monitoring/docker/configs/prometheus/prometheus.yml
# Apply:       docker compose up -d (bind mount → /etc/prometheus/prometheus.yml:ro)
# Module:      monitoring
# Requires:    none
#
# Prometheus scrape configuration — self-monitoring, host (node_exporter), and container (cAdvisor) jobs.
# Parameters modified from baseline: scrape_interval 15s; adds prometheus, node, and cadvisor jobs

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          host: lab-docker

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          host: lab-docker

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          host: lab-docker
