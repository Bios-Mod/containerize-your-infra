# Deploy to:   modules/monitoring/docker/docker-compose.yml
# Apply:       docker compose up -d
# Module:      monitoring
# Requires:    configs/prometheus/prometheus.yml, external Docker network proxy-net (created by reverse-proxy)
#
# Pull-based observability base (dev): Prometheus, node_exporter, and cAdvisor on proxy-net with no exposed ports.
# Parameters modified from baseline: external proxy-net, 15d retention, hardening flags, privileged cAdvisor

services:
  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: node-exporter
    restart: "no"
    pid: host
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - /:/host:ro,rslave
    command:
      - "--path.rootfs=/host"
    networks:
      - proxy-net

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6
    container_name: cadvisor
    restart: "no"
    privileged: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    networks:
      - proxy-net

  prometheus:
    image: prom/prometheus:v3.16.0
    container_name: prometheus
    restart: "no"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./configs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
    depends_on:
      - node-exporter
      - cadvisor
    networks:
      - proxy-net

networks:
  proxy-net:
    external: true
    name: proxy-net
