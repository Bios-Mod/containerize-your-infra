# Deploy to:   EKS (full-infra-dev / full-infra-prod)
# Apply:       helm install / helm upgrade
# Module:      monitoring
# Requires:    templates/blackbox-deployment.yaml (matching selector labels)
#
# ClusterIP Service exposing blackbox_exporter internally on port 9115 for Prometheus probes.
# Parameters modified from baseline: none

apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-blackbox
  labels:
    app.kubernetes.io/name: blackbox
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: monitoring
spec:
  type: {{ .Values.blackbox.service.type }}
  selector:
    app.kubernetes.io/name: blackbox
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.blackbox.service.port }}
      targetPort: http
      protocol: TCP
