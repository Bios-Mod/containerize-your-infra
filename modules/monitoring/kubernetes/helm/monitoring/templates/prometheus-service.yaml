# Deploy to:   EKS (full-infra-dev / full-infra-prod)
# Apply:       helm install / helm upgrade
# Module:      monitoring
# Requires:    templates/prometheus-deployment.yaml (matching selector labels)
#
# ClusterIP Service exposing Prometheus internally on port 9090. Prometheus stays
# internal-only (reached via kubectl port-forward in dev or in-cluster from Grafana).
# Parameters modified from baseline: none

apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-prometheus
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: monitoring
spec:
  type: {{ .Values.prometheus.service.type }}
  selector:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.prometheus.service.port }}
      targetPort: http
      protocol: TCP
