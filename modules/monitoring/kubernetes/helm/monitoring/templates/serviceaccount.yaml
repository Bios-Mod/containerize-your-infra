# Deploy to:   EKS (full-infra-dev / full-infra-prod)
# Apply:       helm install / helm upgrade
# Module:      monitoring
# Requires:    values.yaml
#
# Dedicated ServiceAccount for Prometheus. Only Prometheus mounts an API token
# in this stack because it runs Kubernetes SD and authenticates to kubelet :10250.
# Parameters modified from baseline: none

apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-prometheus
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: monitoring
# Mount the projected ServiceAccount token only for Prometheus API discovery and kubelet auth.
automountServiceAccountToken: true
