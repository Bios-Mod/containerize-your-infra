# Deploy to:   EKS (full-infra-dev / full-infra-prod)
# Apply:       helm install / helm upgrade
# Module:      monitoring
# Requires:    Chart.yaml, values.yaml, Secret monitoring-grafana-admin,
#              templates/grafana-datasource-configmap.yaml, templates/grafana-dashboards-configmap.yaml
#
# Deployment for Grafana. Enforces UID/GID/fsGroup 472, read-only root filesystem,
# dropped capabilities, bundled plugins (GF_PLUGINS_PREINSTALL_DISABLED=true),
# admin password from Kubernetes Secret, and disk-backed emptyDir for state.
# Parameters modified from baseline: none

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-grafana
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: monitoring
spec:
  replicas: {{ .Values.grafana.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/part-of: monitoring
      annotations:
        checksum/config: {{ printf "%s-%s" (include (print $.Template.BasePath "/grafana-datasource-configmap.yaml") .) (include (print $.Template.BasePath "/grafana-dashboards-configmap.yaml") .) | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: grafana
          image: "{{ .Values.grafana.image.repository }}:{{ .Values.grafana.image.tag }}"
          imagePullPolicy: {{ .Values.grafana.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: "admin"
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.grafana.adminSecretName }}
                  key: admin-password
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_SERVER_DOMAIN
              value: {{ .Values.grafana.hostname | quote }}
            - name: GF_SERVER_ROOT_URL
              value: {{ printf "https://%s/" .Values.grafana.hostname | quote }}
            # Keep bundled datasource/panel binaries instead of downloading into read-only storage.
            - name: GF_PLUGINS_PREINSTALL_DISABLED
              value: "true"
            - name: GF_ANALYTICS_REPORTING_ENABLED
              value: "false"
            - name: GF_ANALYTICS_CHECK_FOR_UPDATES
              value: "false"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.grafana.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
            - name: tmp
              mountPath: /tmp
            - name: datasource
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
              readOnly: true
            - name: dashboards
              mountPath: /etc/grafana/dashboards
              readOnly: true
      volumes:
        - name: data
          # Disk-backed emptyDir with sizeLimit (no EBS CSI in this cluster).
          emptyDir:
            sizeLimit: {{ .Values.grafana.dataSizeLimit }}
        - name: tmp
          emptyDir: {}
        - name: datasource
          configMap:
            name: {{ .Release.Name }}-grafana-datasource
        - name: dashboard-provider
          configMap:
            name: {{ .Release.Name }}-grafana-dashboards
            items:
              - key: lab.yml
                path: lab.yml
        - name: dashboards
          configMap:
            name: {{ .Release.Name }}-grafana-dashboards
            items:
              - key: lab-overview-k8s.json
                path: lab-overview-k8s.json
