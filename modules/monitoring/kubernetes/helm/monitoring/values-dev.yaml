# Deploy to:   EKS, namespace full-infra-dev
# Apply:       helm install / helm upgrade -f values.yaml -f values-dev.yaml
# Module:      monitoring
# Requires:    values.yaml (baseline)
#
# Dev-only overrides. Scales Prometheus resources down for lightweight validation
# on the shared dev namespace and states blackbox resources explicitly.
# Parameters modified from baseline: prometheus.resources, blackbox.resources

prometheus:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

blackbox:
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 50m
      memory: 48Mi
