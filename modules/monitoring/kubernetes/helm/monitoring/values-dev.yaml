# Deploy to:   EKS, namespace full-infra-dev
# Apply:       helm install / helm upgrade -f values.yaml -f values-dev.yaml
# Module:      monitoring
# Requires:    values.yaml (baseline)
#
# Dev-only overrides. Scales Prometheus CPU/memory requests and limits down for
# lightweight validation on the shared dev namespace.
# Parameters modified from baseline: prometheus.resources

prometheus:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
