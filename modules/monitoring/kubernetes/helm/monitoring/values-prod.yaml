# Deploy to:   EKS, namespace full-infra-prod
# Apply:       helm install / helm upgrade -f values.yaml -f values-prod.yaml
# Module:      monitoring
# Requires:    values.yaml (baseline)
#
# Prod environment values. Explicitly records the prod replicaCount and resource
# bounds (kept below full-infra-prod LimitRange max 500m/512Mi).
# Parameters modified from baseline: none — explicit prod baseline

prometheus:
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 192Mi
    limits:
      cpu: 300m
      memory: 384Mi
